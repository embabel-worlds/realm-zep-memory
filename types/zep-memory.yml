# ZEP MEMORY — Zep Cloud's temporal knowledge graph as a child of the world's shared `Memory`
# label (default-world types/memory.yml). Every node carries :Memory and :ZepMemory, so:
#
#   MATCH (:Concept {value:'coffee'})-[r:RELEVANT_TO]->(m:Memory)     -- every memory system
#   MATCH (:Concept {value:'coffee'})-[r:RELEVANT_TO]->(m:ZepMemory)  -- Zep alone
#
# A Zep fact is an EDGE of its graph with a validity window: valid_at (when it began to hold),
# invalid_at (when it stopped), expired_at (when Zep retired it). The contract's validFrom /
# validTo are that window, so "what was true in March" is a predicate on the node:
#   MATCH (:Concept {value:'employer'})-[:RELEVANT_TO]->(m:ZepMemory)
#   WHERE m.validFrom <= '2026-03-01' AND (m.validTo IS NULL OR m.validTo > '2026-03-01')
# Curation: a fact Zep still holds is ACTIVE; one it has invalidated or expired is SUPERSEDED and
# is read only when the query pins status:'SUPERSEDED' (the Memory lifecycle).
- name: ZepMemory
  parents: [Memory]
  visibility: internal
  userAnchor: false
  description: "A fact in Zep Cloud's temporal memory graph — what Zep extracted about the user, with the window in which it held (m.validFrom / m.validTo). One of the memory systems behind :Memory; reach it from a free-text Concept via RELEVANT_TO (Zep's own graph search, reranked), or name :ZepMemory to read Zep alone. Per-match data on the EDGE: r.score (Zep's score), r.mode, r.rank."
  virtualJoins:
    - anchorLabel: Concept
      relationship: RELEVANT_TO
      keyField: value
      recordKeyField: matchedFor
      producer: zepRecall
      description: "Relevance of a Zep fact to a FREE-TEXT topic, by Zep's own hybrid graph search — \"what does Zep remember about X\". Seeded from a query literal, e.g. (:Concept {value:'coffee'})-[:RELEVANT_TO]->(:ZepMemory). Per-match data on the EDGE: r.score, r.mode, r.rank."
  properties:
    id:
      description: "The fact's uuid in Zep — the node identity."
      metadata:
        identity: "true"
    name: "Zep's name for the relation the fact expresses (e.g. WORKS_AT)."
    expired: "When Zep retired the fact, if it has (ISO-8601)."
