# Recall over Zep Cloud's graph: `graph/search` over the EDGES of one user's graph — Zep's facts —
# with Zep's own reranked score carried onto the edge as r.score (`recordScoreField`). A
# `remote-search` producer: Zep searches itself; nothing is ingested. `{query}` is the anchor's
# text; the user id is the key the realm's keys.yml binds.
#
# `compute:` maps Zep's fact onto the Memory contract: the fact is the text; valid_at / invalid_at
# are the window in which it held (validFrom / validTo); a fact Zep has not invalidated or expired
# is ACTIVE, one it has is SUPERSEDED — so a plain read returns what Zep currently holds true, and a
# `status:'SUPERSEDED'` pin reads what it no longer does. `name` is Zep's relation name.
- name: zepRecall
  kind: remote-search
  operation: graphSearch
  args:
    query: "{query}"
    user_id: "<zep user id>"
    scope: edges
    limit: 8
    reranker: rrf
  records: "$.edges[*]"
  idField: uuid
  recordScoreField: score
  k: 8
  minScore: 0.0
  compute:
    text: "r.fact"
    name: "r.name"
    source: "'zep'"
    confidence: "1.0"
    status: "CASE WHEN r.invalid_at IS NULL AND r.expired_at IS NULL THEN 'ACTIVE' ELSE 'SUPERSEDED' END"
    created: "r.created_at"
    revised: "coalesce(r.expired_at, r.created_at)"
    validFrom: "r.valid_at"
    validTo: "r.invalid_at"
    expired: "r.expired_at"
